#version=RHEL9
text
lang en_US.UTF-8
keyboard us
timezone UTC --utc

network --bootproto=dhcp --device=eth0 --onboot=yes --hostname=packer

rootpw --lock
user --name=packer --password=packer --plaintext --groups=wheel

bootloader --location=mbr --driveorder=sda
zerombr
clearpart --all --initlabel
autopart --type=lvm

skipx
firstboot --disable
selinux --permissive
firewall --disabled

%packages --ignoremissing
@^minimal-environment
curl
git
unzip
vim
wget
sudo
%end

%post
echo 'packer ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/packer
chmod 440 /etc/sudoers.d/packer
%end

reboot
